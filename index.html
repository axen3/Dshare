<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DShare - P2P File Transfer</title>
    <!-- Import PeerJS Library -->
    <script src="https://unpkg.com"></script>
    <!-- Import QRCode.js Library -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; 
            max-width: 500px; 
            margin: 40px auto; 
            padding: 20px; 
            background: #f8fafc; 
            color: #0f172a; 
        }
        h2 { text-align: center; color: #2563eb; margin-bottom: 5px; }
        .tagline { text-align: center; color: #64748b; font-size: 0.9rem; margin-bottom: 25px; }
        .card { background: white; padding: 22px; border-radius: 16px; box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05); margin-bottom: 20px; border: 1px solid #e2e8f0; }
        h3 { margin-top: 0; color: #1e293b; font-size: 1.1rem; border-bottom: 1px solid #f1f5f9; padding-bottom: 8px; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; box-sizing: border-box; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 1rem; }
        input:focus { outline: 2px solid #2563eb; border-color: transparent; }
        button { background: #2563eb; color: white; border: none; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #1d4ed8; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        .status { font-weight: bold; color: #2563eb; font-family: monospace; font-size: 1.1rem; text-align: center; padding: 8px; background: #eff6ff; border-radius: 6px; word-break: break-all; }
        #qrcode { display: flex; justify-content: center; margin: 15px 0; min-height: 128px; }
        #log { font-size: 0.95rem; color: #334155; line-height: 1.5; }
    </style>
</head>
<body>

    <h2>⚡ DShare</h2>
    <p class="tagline">Direct Peer-to-Peer Local File Sharing</p>
    
    <!-- 1. DEVICE IDENTIFICATION & QR CODE -->
    <div class="card">
        <h3>This Device</h3>
        <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 10px;">Your mobile device can scan this QR code to instantly paste your ID, or you can check the URL parameters if sharing a link.</p>
        <div id="my-id" class="status">Initializing connection...</div>
        <div id="qrcode"></div>
    </div>

    <!-- 2. SENDER FORM -->
    <div class="card">
        <h3>Send File</h3>
        <input type="text" id="receiver-id" placeholder="Enter Target Device ID">
        <input type="file" id="file-input">
        <button id="send-btn" disabled>Send File</button>
    </div>

    <!-- 3. TRANSFERS LOG -->
    <div class="card">
        <h3>Activity Log</h3>
        <div id="log">Ready. Connect devices to begin.</div>
    </div>

    <script>
        const myIdDisplay = document.getElementById('my-id');
        const receiverIdInput = document.getElementById('receiver-id');
        const fileInput = document.getElementById('file-input');
        const sendBtn = document.getElementById('send-btn');
        const logBox = document.getElementById('log');
        const qrContainer = document.getElementById('qrcode');

        // Check if there is an ID passed directly in the URL string (?to=XXXXX)
        const urlParams = new URLSearchParams(window.location.search);
        const targetFromUrl = urlParams.get('to');
        if (targetFromUrl) {
            receiverIdInput.value = targetFromUrl;
        }

        // Initialize PeerJS to connect to public signaling web clouds
        const peer = new Peer();

        // When connected successfully to signaling server
        peer.on('open', (id) => {
            myIdDisplay.textContent = id;
            sendBtn.disabled = false;

            // Clear container and generate a QR containing the ID
            qrContainer.innerHTML = "";
            new QRCode(qrContainer, {
                text: id,
                width: 128,
                height: 128,
                colorDark : "#0f172a",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        });

        // ==========================================
        // RECEIVER ROUTINES (Incoming connections)
        // ==========================================
        peer.on('connection', (conn) => {
            logBox.innerHTML = `Connected to peer: <b>${conn.peer}</b><br>Awaiting file stream...`;
            
            let receivedChunks = [];
            let fileInfo = null;

            conn.on('data', (data) => {
                if (data.type === 'metadata') {
                    fileInfo = data;
                    receivedChunks = [];
                    logBox.innerHTML = `Receiving: <b>${data.name}</b> (${(data.size/1024/1024).toFixed(2)} MB)...`;
                } else if (data.type === 'chunk') {
                    receivedChunks.push(data.payload);
                    
                    // Track download progress visually
                    let percent = Math.round((receivedChunks.length / data.totalChunks) * 100);
                    logBox.innerHTML = `Downloading: <b>${percent}%</b>`;

                    if (receivedChunks.length === data.totalChunks) {
                        const fileBlob = new Blob(receivedChunks);
                        const downloadUrl = URL.createObjectURL(fileBlob);
                        
                        logBox.innerHTML = `
                            <p style="color: #16a34a; font-weight: bold; margin-top: 0;">✓ File fully received!</p>
                            <a href="${downloadUrl}" download="${fileInfo.name}" style="text-decoration: none;">
                                <button style="background: #16a34a;">Download ${fileInfo.name}</button>
                            </a>
                        `;
                    }
                }
            });
        });

        // ==========================================
        // SENDER ROUTINES (Outgoing connections)
        // ==========================================
        sendBtn.addEventListener('click', () => {
            const targetId = receiverIdInput.value.trim();
            const file = fileInput.files[0];

            if (!targetId || !file) {
                alert("Please type a valid Receiver ID and select a file first.");
                return;
            }

            logBox.innerHTML = `Attempting handshake with <b>${targetId}</b>...`;
            
            const conn = peer.connect(targetId);

            conn.on('open', () => {
                logBox.innerHTML = `Handshake verified. Slicing file: <b>${file.name}</b>`;
                
                const chunkSize = 64 * 1024; // Smooth 64KB WebRTC data chunks
                const totalChunks = Math.ceil(file.size / chunkSize);
                
                // Dispatch metadata envelope first
                conn.send({
                    type: 'metadata',
                    name: file.name,
                    size: file.size
                });

                let currentChunk = 0;

                function sendNextChunk() {
                    const start = currentChunk * chunkSize;
                    const end = Math.min(start + chunkSize, file.size);
                    const blobSlice = file.slice(start, end);
                    
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        conn.send({
                            type: 'chunk',
                            payload: e.target.result,
                            currentChunk: currentChunk,
                            totalChunks: totalChunks
                        });

                        currentChunk++;
                        
                        if (currentChunk < totalChunks) {
                            // Monitor progress percentages
                            let progress = Math.round((currentChunk / totalChunks) * 100);
                            logBox.innerHTML = `Uploading stream: <b>${progress}%</b>`;
                            
                            // Small micro-delay prevents network buffer crashes
                            setTimeout(sendNextChunk, 1); 
                        } else {
                            logBox.innerHTML = `<span style="color: #16a34a; font-weight: bold;">✓ File dispatched successfully!</span>`;
                        }
                    };
                    reader.readAsArrayBuffer(blobSlice);
                }

                sendNextChunk();
            });

            conn.on('error', (err) => {
                logBox.innerHTML = `<span style="color: #dc2626;">Connection error. Verify the ID is correct.</span>`;
            });
        });
    </script>
</body>
</html>
